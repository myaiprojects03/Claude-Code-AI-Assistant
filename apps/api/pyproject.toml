[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-api"
version = "0.1.0"
description = "Core API for the AI assistant (free stack)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "tzdata>=2024.2",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "fastembed>=0.4",
  "holidays>=0.60",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "podman-compose>=1.2",
]

[project.scripts]
assistant-worker = "assistant.outbox.worker:main"
assistant-ingest = "assistant.kb.public:main"
assistant-ingest-internal = "assistant.kb.internal:main"
assistant-seed = "assistant.seed:main"
assistant-check-integrations = "assistant.check_integrations:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"src/assistant/config_store.py" = ["E501"]  # prompt prose
"src/assistant/seed.py" = ["E501"]  # demo prose
