# Local dev stack. Works with `podman compose` or `docker compose`.
#   podman compose -f infra/compose.yaml up -d                 # core
#   podman compose -f infra/compose.yaml --profile obs up -d   # + Prometheus/Grafana
#
# All images are free and open source. Credentials below are LOCAL DEV ONLY.

name: assistant

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant-dev
      POSTGRES_DB: assistant
    ports: ["5433:5432"]  # 5432 is taken by a local PostgreSQL service
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: assistant
      KC_DB_PASSWORD: assistant-dev
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:8080
    ports: ["8080:8080"]
    volumes:
      - ./keycloak/realm-assistant.json:/opt/keycloak/data/import/realm-assistant.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025

  prometheus:
    profiles: ["obs"]
    image: docker.io/prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    extra_hosts:
      - "host.containers.internal:host-gateway"

  grafana:
    profiles: ["obs"]
    image: docker.io/grafana/grafana-oss:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin-dev
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
