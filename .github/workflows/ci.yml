name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant-dev
          POSTGRES_DB: assistant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://assistant:assistant-dev@localhost:5432/assistant_test
      LLM_CHAIN: fake
      EMBEDDER: hash  # no model download in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Migrations apply cleanly
        run: |
          if ls migrations/versions/*.py >/dev/null 2>&1; then
            ALEMBIC_DATABASE_URL=postgresql+asyncpg://assistant:assistant-dev@localhost:5432/assistant_test alembic upgrade head
            ALEMBIC_DATABASE_URL=postgresql+asyncpg://assistant:assistant-dev@localhost:5432/assistant_test alembic downgrade base
          fi
      - name: Tests
        run: pytest -q

  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/widget/package-lock.json
      - run: npm ci --cache .npm-cache
      - run: npm run build
      - name: Bundle stays small
        run: test $(stat -c%s dist/assistant-chat.js) -lt 60000

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --cache .npm-cache
      - name: Type-check and build
        run: npm run build
